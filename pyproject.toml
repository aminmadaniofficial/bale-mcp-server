[project]
name = "bale-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Bale Messenger user accounts and automation"
readme = "README.md"
authors = [
    { name = "Amin Madani", email = "aminmadani112@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "aiobale-py>=0.3.9",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "rich>=13.0",
]

[project.scripts]
bale-mcp = "bale_mcp.cli:main"
bale-mcp-server = "bale_mcp.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
